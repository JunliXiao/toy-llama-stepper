<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Toy Llama Block Stepper - LLM 逐步計算與線性代數視覺化工具</title>
  <meta name="description" content="互動式 Toy Llama (LLM) 逐步計算視覺化工具。直觀觀察 Transformer 中 Residual Stream、Attention QKV 投影、RoPE 旋轉編碼與 SwiGLU 的線性代數運算過程。">
  <meta name="keywords" content="LLM, Transformer, LLaMA, 視覺化, 線性代數, Attention, SwiGLU, RoPE, 機器學習">
  <meta name="author" content="Junli Xiao">
  <link rel="canonical" href="https://junlixiao.github.io/toy-llama-stepper/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://junlixiao.github.io/toy-llama-stepper/">
  <meta property="og:title" content="Toy Llama Block Stepper - LLM 逐步計算視覺化">
  <meta property="og:description" content="深入拆解 Transformer / LLaMA 的每一步矩陣運算！支援動態編輯 X₀ 輸入、觀察多頭注意力與 Residual Stream 範數變化。">
  <meta property="og:image" content="https://raw.githubusercontent.com/JunliXiao/toy-llama-stepper/refs/heads/main/resources/og-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Toy Llama Stepper">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://junlixiao.github.io/toy-llama-stepper/">
  <meta name="twitter:title" content="Toy Llama Block Stepper - LLM 逐步計算視覺化">
  <meta name="twitter:description" content="深入拆解 Transformer / LLaMA 的每一步矩陣運算！支援動態編輯 X₀ 輸入、觀察多頭注意力與 Residual Stream 範數變化。">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/JunliXiao/toy-llama-stepper/refs/heads/main/resources/og-preview.png">

  <link id="favicon" rel="icon" type="image/svg+xml" href="./resources/icon-light.svg">
  <link rel="stylesheet" href="./css/style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Toy Llama Block Stepper",
    "url": "https://junlixiao.github.io/toy-llama-stepper/",
    "description": "互動式 Toy Llama (LLM) 逐步計算視覺化工具，幫助理解 Transformer 中的矩陣與向量計算步驟。",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "All"
  }
  </script>

  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      svg: { fontCache: 'global' },
      startup: {
        typeset: false,
        ready: () => {
          MathJax.startup.defaultReady();
          const fx = document.querySelector('#fx');
          if (fx && window.typeset) window.typeset(fx);
        }
      }
    };
  </script>
  <script async src="./js/vendor/tex-svg.min.js"></script>

  <!-- 預設載入純靜態模型權重 (開箱即用、無須執行期運算)；若本地開發想動態調整生成邏輯，可改用 presets.js -->
  <script src="./models/models-static.js"></script>
</head>

<body>
  <div id="app">
    <header><b>Toy Llama Stepper</b>
      <button id="b0">⏮</button><button id="bp">◀ 上一步</button><button id="bn">下一步 ▶</button><button id="b1">⏭</button>
      <span id="pos" class="mu"></span><span style="flex:1"></span>
      <label>模型 <select id="ms"></select></label>
      <button id="tl" title="收合/展開左側步驟清單 (快捷鍵: [)">⇤</button>
      <button id="tr" title="收合/展開右側資訊欄 (快捷鍵: ])">⇥</button>
      <button id="hk" title="鍵盤快捷鍵指南 (快捷鍵: ?)">⌨️</button>
      <button id="th">🌓</button>
    </header>
    <nav id="list"></nav>
    <main id="main"></main>
    <aside id="side"></aside>
  </div>

  <div id="modal-kb" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-hd">
        <b>⌨️ 鍵盤快捷鍵指南</b>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <div class="modal-sec">導航操作</div>
      <div class="modal-row"><span><span class="kbd">←</span> / <span class="kbd">→</span></span><span>上一步 / 下一步</span></div>
      <div class="modal-row"><span><span class="kbd">Ctrl</span> + <span class="kbd">←</span> / <span class="kbd">→</span></span><span>跳至第一步 (X₀) / 最後一步</span></div>
      <div class="modal-row"><span><span class="kbd">↑</span> / <span class="kbd">↓</span></span><span>跨 Layer 同階段移動</span></div>
      <div class="modal-sec">介面與觀察維度</div>
      <div class="modal-row"><span><span class="kbd">[</span> / <span class="kbd">]</span></span><span>收合/展開左側欄 / 右側欄</span></div>
      <div class="modal-row"><span><span class="kbd">Q</span> / <span class="kbd">W</span></span><span>循環切換上一個 / 下一個 Q head</span></div>
      <div class="modal-ft">提示：按 <span class="kbd">?</span> 開關此指南，按 <span class="kbd">Esc</span> 關閉。</div>
    </div>
  </div>

  <!-- 應用程式模組 (Scheme A Namespace Architecture)；載入順序需注意依賴關係 -->
  <script src="./js/steps.js"></script>
  <script src="./js/model.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/view.js"></script>
  <script src="./js/app.js"></script>
</body>

</html>
