<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Toy Llama Block Stepper</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="./resources/icon-light.svg">
  <style>
    :root {
      --bg: #f6f6f3;
      --pn: #fff;
      --tx: #1d1d1b;
      --mu: #6b6b66;
      --bd: #dcdcd6;
      --ac: #2563eb;
      --pos: 37, 99, 235;
      --neg: 220, 60, 60;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    :root[data-theme="dark"] {
      --bg: #17171a;
      --pn: #212126;
      --tx: #ececea;
      --mu: #9a9a94;
      --bd: #38383f;
      --ac: #6ea0ff;
      --pos: 90, 150, 255;
      --neg: 240, 100, 100
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 13px/1.55 system-ui, "Noto Sans TC", "PingFang TC", sans-serif
    }

    #app {
      display: grid;
      grid-template-columns: 210px 1fr 310px;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "head head head"
        "list main side";
      height: 100%
    }

    #app.hide-l {
      grid-template-columns: 0 1fr 310px;
    }

    #app.hide-r {
      grid-template-columns: 210px 1fr 0;
    }

    #app.hide-l.hide-r {
      grid-template-columns: 0 1fr 0;
    }

    #app.hide-l #list,
    #app.hide-r #side {
      display: none;
    }

    header {
      grid-area: head;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid var(--bd);
      background: var(--pn);
      flex-wrap: wrap
    }

    header b {
      margin-right: 8px
    }

    button,
    select,
    input {
      font: inherit;
      color: var(--tx);
      background: var(--pn);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 3px 9px
    }

    button {
      cursor: pointer
    }

    button:hover {
      border-color: var(--ac)
    }

    button.toggled {
      opacity: 0.5;
      background: var(--bg);
    }

    #list,
    #main,
    #side {
      overflow: auto;
      padding: 10px 12px;
      min-height: 0
    }

    #list {
      grid-area: list;
      border-right: 1px solid var(--bd);
      background: var(--pn);
      padding: 6px
    }

    #main {
      grid-area: main;
    }

    #side {
      grid-area: side;
      border-left: 1px solid var(--bd);
      background: var(--pn)
    }

    .lh {
      font-weight: 600;
      color: var(--mu);
      margin: 8px 6px 2px;
      font-size: 12px
    }

    .si {
      padding: 2px 8px;
      border-radius: 5px;
      cursor: pointer
    }

    .si:hover {
      background: var(--bg)
    }

    .si.a {
      background: var(--ac);
      color: #fff
    }

    h2 {
      margin: 0 0 4px;
      font-size: 18px
    }

    .card {
      background: var(--pn);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 8px 0
    }

    #fx {
      font-size: 15px;
      overflow-x: auto;
      min-height: 36px
    }

    .mu {
      color: var(--mu)
    }

    .mw {
      overflow: auto;
      max-width: 100%
    }

    .mt {
      border-collapse: collapse;
      font: 11.5px ui-monospace, Menlo, Consolas, monospace
    }

    .mt th {
      color: var(--mu);
      font-weight: 400;
      padding: 1px 5px;
      text-align: center
    }

    .mt td {
      padding: 2px 5px;
      text-align: right;
      border: 1px solid var(--bd);
      min-width: 38px
    }

    .mt td.cl {
      cursor: pointer
    }

    .mt td.on {
      outline: 2px solid var(--ac)
    }

    .mt input {
      width: 46px;
      border: 0;
      border-radius: 0;
      padding: 1px 3px;
      text-align: right;
      font: inherit;
      background: transparent
    }

    .tl {
      margin: 8px 0 3px;
      font-weight: 600
    }

    .mic {
      margin-top: 5px;
      padding: 6px 9px;
      border-left: 3px solid var(--ac);
      background: var(--bg);
      font: 11.5px ui-monospace, Menlo, Consolas, monospace;
      word-break: break-all
    }

    .st {
      font: 11.5px ui-monospace, Menlo, Consolas, monospace
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0
    }

    h3 {
      margin: 12px 0 4px;
      font-size: 13px
    }

    .tip-title {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: help;
      position: relative;
      margin: 12px 0 4px;
      font-size: 13px;
    }

    .tip-title .info-icon {
      font-size: 11px;
      color: var(--mu);
      font-weight: 400;
      opacity: 0.85;
      transition: color 0.15s;
    }

    .tip-title:hover .info-icon {
      color: var(--ac);
    }

    .tip-title .tip-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      background: var(--pn);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: normal;
      line-height: 1.45;
      width: 230px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-3px);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
      z-index: 100;
      pointer-events: none;
    }

    .tip-title:hover .tip-box {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #side a {
      color: var(--ac);
      text-decoration: none;
      border-bottom: 1px dotted var(--ac);
      transition: opacity 0.2s;
    }

    #side a:hover {
      opacity: 0.8;
      border-bottom-style: solid;
    }

    #side a:visited {
      color: var(--ac);
    }
	
    #side a.social-icon-link {
      border-bottom: none !important;
      color: var(--tx);
      display: inline-block;
      margin-left: 4px;
    }
    
    #side a.social-icon-link svg {
      fill: currentColor;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.2s;
    }
    
    #side a.social-icon-link:hover svg {
      opacity: 1;
      transform: scale(1.1);
    }

    /* ===== Modal 快捷鍵指南 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--pn);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 16px 20px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    }

    .modal-hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--bd);
    }

    .modal-close {
      background: transparent;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: var(--mu);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .modal-close:hover {
      color: var(--tx);
      background: var(--bg);
    }

    .modal-sec {
      font-weight: 600;
      color: var(--mu);
      font-size: 11px;
      margin: 10px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px dashed var(--bd);
      font-size: 12.5px;
    }

    .modal-row:last-of-type {
      border-bottom: none;
    }

    .modal-ft {
      margin-top: 14px;
      font-size: 11.5px;
      color: var(--mu);
      text-align: center;
    }

    .kbd {
      display: inline-block;
      padding: 1px 6px;
      font: 11px ui-monospace, Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 4px;
      box-shadow: 0 1px 0 var(--bd);
      font-weight: 600;
    }
  </style>
  <script>window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] }, svg: { fontCache: 'global' } };</script>
  <script async src="./resources/tex-svg.min.js" onload="window.render&&render()"></script>
  <!-- 預設載入純靜態模型權重 (開箱即用、無須執行期運算)；若本地開發想動態調整生成邏輯，可改用 presets.js -->
  <script src="./models/models-static.js"></script>
</head>

<body>
  <div id="app">
    <header><b>Toy Llama Stepper</b>
      <button id="b0">⏮</button><button id="bp">◀ 上一步</button><button id="bn">下一步 ▶</button><button id="b1">⏭</button>
      <span id="pos" class="mu"></span><span style="flex:1"></span>
      <label>模型 <select id="ms"></select></label>
      <button id="tl" title="收合/展開左側步驟清單 (快捷鍵: [)">⇤</button>
      <button id="tr" title="收合/展開右側資訊欄 (快捷鍵: ])">⇥</button>
      <button id="hk" title="鍵盤快捷鍵指南 (快捷鍵: ?)">⌨️</button>
      <button id="th">🌓</button>
    </header>
    <nav id="list"></nav>
    <main id="main"></main>
    <aside id="side"></aside>
  </div>
  <div id="modal-kb" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-hd">
        <b>⌨️ 鍵盤快捷鍵指南</b>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <div class="modal-sec">導航操作</div>
      <div class="modal-row"><span><span class="kbd">←</span> / <span class="kbd">→</span></span><span>上一步 / 下一步</span></div>
      <div class="modal-row"><span><span class="kbd">Ctrl</span> + <span class="kbd">←</span> / <span class="kbd">→</span></span><span>跳至第一步 (X₀) / 最後一步</span></div>
      <div class="modal-row"><span><span class="kbd">↑</span> / <span class="kbd">↓</span></span><span>跨 Layer 同階段移動</span></div>
      <div class="modal-sec">介面與觀察維度</div>
      <div class="modal-row"><span><span class="kbd">[</span> / <span class="kbd">]</span></span><span>收合/展開左側欄 / 右側欄</span></div>
      <div class="modal-row"><span><span class="kbd">Q</span> / <span class="kbd">W</span></span><span>循環切換上一個 / 下一個 Q head</span></div>
      <div class="modal-ft">提示：按 <span class="kbd">?</span> 開關此指南，按 <span class="kbd">Esc</span> 關閉。</div>
    </div>
  </div>
  <script>
    /* ===== 基本設定（d_model 與層數固定）===== */
    const cfg = { d: 16, L: 4, Hq: 4, Hkv: 2, hd: 4, ffm: 3, theta: 10000, T: 5, seed: 7 };
    const sel = { step: 0, h: 0, mi: null, model: 'baseline' };
    let W, X0, steps = [], ck = [];

    /* ===== 工具 ===== */
    const $ = s => document.querySelector(s);
    const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 };
    const gauss = r => (r() + r() + r() + r() - 2) * 1.732;
    const rmat = (r, n, m, s) => Array.from({ length: n }, () => Array.from({ length: m }, () => gauss(r) * s));
    const tr = A => A[0].map((_, j) => A.map(r => r[j]));
    const add = (A, B) => A.map((r, i) => r.map((v, j) => v + B[i][j]));
    const nrm = v => Math.sqrt(v.reduce((a, b) => a + b * b, 0));
    const rms = (X, g) => X.map(r => { const s = Math.sqrt(r.reduce((a, v) => a + v * v, 0) / r.length + 1e-6); return r.map((v, i) => v / s * g[i]) });
    const f2 = v => isFinite(v) ? v.toFixed(2) : (v < 0 ? '−∞' : '∞');
    const silu = z => z / (1 + Math.exp(-z));
    const ones = n => Array(n).fill(1);
    function rope(M) { const h = cfg.hd / 2; return M.map((r, t) => { const o = r.slice(); for (let i = 0; i < h; i++) { const a = t * Math.pow(cfg.theta, -2 * i / cfg.hd), c = Math.cos(a), s = Math.sin(a); o[i] = r[i] * c - r[i + h] * s; o[i + h] = r[i] * s + r[i + h] * c } return o }) }
    /* item：A (T×k) 與 Bt (n×k) 的逐列內積，附 micro 展開 */
    const item = (A, Bt, an, bn, div = 1) => {
      const m = A.map(a => Bt.map(b => a.reduce((s, v, k) => s + v * b[k], 0) / div));
      return { m, micro: (i, j) => `${an}[t${i}] · ${bn}[${j}] = (` + A[i].map((v, k) => `${f2(v)}×${f2(Bt[j][k])}`).join(' + ') + `)${div != 1 ? ' / √d_h(' + f2(div) + ')' : ''} = <b>${f2(m[i][j])}</b>` }
    };

    /* ===== 輸入與模型載入 ===== */
    function initInput(regen) {
      if (regen || !X0 || X0.length !== cfg.T) {
        X0 = rmat(rng(cfg.seed + 999), cfg.T, cfg.d, 1);
      }
    }

    /* Fallback 權重生成（當未載入 TOY_MODELS 時） */
    function makeWeights(regenX) {
      const { d, L, Hq, Hkv, hd, T } = cfg, ff = d * cfg.ffm, r = rng(cfg.seed);
      W = { layers: [], gf: ones(d) };
      for (let l = 0; l < L; l++)W.layers.push({
        g1: ones(d), g2: ones(d),
        Wq: rmat(r, d, Hq * hd, 1 / Math.sqrt(d)), Wk: rmat(r, d, Hkv * hd, 1 / Math.sqrt(d)), Wv: rmat(r, d, Hkv * hd, 1 / Math.sqrt(d)),
        Wo: rmat(r, Hq * hd, d, 1 / Math.sqrt(Hq * hd)), Wg: rmat(r, d, ff, 1 / Math.sqrt(d)), Wu: rmat(r, d, ff, 1 / Math.sqrt(d)), Wd: rmat(r, ff, d, 1 / Math.sqrt(ff))
      });
      if (regenX) initInput(true);
    }

    function loadModel(modelId, regenX = false) {
      sel.model = modelId;
      const models = window.TOY_MODELS || {};
      const m = models[modelId] || models['baseline'];
      if (m) {
        Object.assign(cfg, m.config);
        W = {
          layers: m.layers,
          gf: m.gf || ones(cfg.d)
        };
      } else {
        makeWeights(regenX);
      }
      initInput(regenX);
      sel.h = Math.min(sel.h, cfg.Hq - 1);
      fillHs();
      fillMs();
      forward();
      sel.mi = null;
      render();
    }

    const RMS = String.raw`\hat{x}_t=\frac{x_t}{\sqrt{\tfrac1d\sum_{i=1}^{d}x_{t,i}^2+\varepsilon}}\odot g`;
    function stats(x, dx) { return '<table class="mt"><tr><th></th><th>‖x‖</th><th>‖Δ‖</th><th>cos(x,Δ)</th><th>‖x+Δ‖</th></tr>' + x.map((r, t) => { const a = nrm(r), b = nrm(dx[t]), c = r.reduce((s, v, i) => s + v * dx[t][i], 0) / (a * b + 1e-12), y = nrm(r.map((v, i) => v + dx[t][i])); return `<tr><th>t${t}</th><td>${f2(a)}</td><td>${f2(b)}</td><td>${f2(c)}</td><td>${f2(y)}</td></tr>` }).join('') + '</table>' }

    /* ===== 前向計算，同時產生每個步驟 ===== */
    function forward() {
      const { T, d, Hq, Hkv, hd, L } = cfg, grp = Hq / Hkv; steps = []; ck = []; let x = X0;
      const P = (layer, name, tex, desc, tensors, st) => steps.push({ layer, name, tex, desc, tensors, st, ci: ck.length - 1 });
      const R = n => [...Array(n).keys()];
      ck.push({ x, label: 'X₀' });
      P(-1, 'Input X₀', String.raw`X_0\in\mathbb{R}^{T\times d}`, '直接把 X₀ 當作 embedding 之後的 residual stream（殘差流）：每一列是一個 position 的向量。你可以直接編輯下面任何一格，後面所有步驟會即時重算。', [{ label: 'X₀（T×d，可編輯）', items: [{ m: x, edit: true }] }]);
      for (let l = 0; l < L; l++) {
        const w = W.layers[l], n1 = rms(x, w.g1);
        P(l, 'Attn RMSNorm', RMS, 'pre-norm：每個 position 各自除以自己的 RMS，再乘增益 g（此處 g=1）。只改變向量長度，不改變方向；注意 residual stream 本身沒有被改動，送進 attention 的只有 x̂。', [{ label: 'x（residual stream）', items: [{ m: x }] }, { label: 'x̂ = RMSNorm(x)', items: [{ m: n1 }] }]);
        const tq = tr(w.Wq), tk = tr(w.Wk), tv = tr(w.Wv);
        const Q = R(Hq).map(h => item(n1, tq.slice(h * hd, h * hd + hd), 'x̂', 'Wq')), K = R(Hkv).map(g => item(n1, tk.slice(g * hd, g * hd + hd), 'x̂', 'Wk')), V = R(Hkv).map(g => item(n1, tv.slice(g * hd, g * hd + hd), 'x̂', 'Wv'));
        P(l, 'Q / K / V 投影', String.raw`Q_h=\hat X W_Q^{(h)},\quad K_g=\hat X W_K^{(g)},\quad V_g=\hat X W_V^{(g)},\quad g=\lfloor h/(H_q/H_{kv})\rfloor`, `GQA：${Hq} 個 Q head 共用 ${Hkv} 組 K/V，每 ${grp} 個 Q head 共用一組。Q 決定「我想找什麼」，K 決定「我能被怎麼找到」，V 是「被讀走的內容」。點任一格可展開成逐項乘加。`, [{ label: 'Q', by: 'q', items: Q }, { label: 'K', by: 'kv', items: K }, { label: 'V', by: 'kv', items: V }]);
        const Qr = Q.map(o => rope(o.m)), Kr = K.map(o => rope(o.m));
        const ang = R(T).map(t => R(hd / 2).map(i => (t * Math.pow(cfg.theta, -2 * i / hd) * 180 / Math.PI) % 360));
        P(l, 'RoPE', String.raw`\begin{pmatrix}q'_i\\ q'_{i+d_h/2}\end{pmatrix}=\begin{pmatrix}\cos m\theta_i&-\sin m\theta_i\\ \sin m\theta_i&\cos m\theta_i\end{pmatrix}\begin{pmatrix}q_i\\ q_{i+d_h/2}\end{pmatrix},\quad\theta_i=\Theta^{-2i/d_h}`, '只旋轉 Q 與 K（V 不動）。位置 m 的向量在第 i 個二維平面轉 mθᵢ，向量長度不變，但 Q·K 之後只依賴相對距離。θᵢ 隨 i 變小：前面的維度轉得快（高頻），後面轉得慢（低頻）。', [{ label: 'Q（RoPE 前）', by: 'q', items: Q }, { label: "Q′（RoPE 後）", by: 'q', items: Qr.map(m => ({ m })) }, { label: "K′（RoPE 後）", by: 'kv', items: Kr.map(m => ({ m })) }, { label: '旋轉角 mθᵢ（度，mod 360）', items: [{ m: ang }] }]);
        const S = Qr.map((q, h) => item(q, Kr[Math.floor(h / grp)], "q′", "k′", Math.sqrt(hd)));
        P(l, 'Scores QKᵀ', String.raw`S_h=\frac{Q'_h\,{K'_g}^{\top}}{\sqrt{d_h}}`, 'S[i][j] 是 position i 的 query 與 position j 的 key 的內積（除以 √d_h 穩定尺度）。此時還沒有 mask，上三角的值之後會被丟掉。', [{ label: 'S = Q′K′ᵀ/√d_h（mask 前）', by: 'q', items: S }]);
        const Sm = S.map(o => o.m.map((r, i) => r.map((v, j) => j > i ? -Infinity : v)));
        const A = Sm.map(M => M.map(r => { const mx = Math.max(...r), e = r.map(v => Math.exp(v - mx)), s = e.reduce((a, b) => a + b); return e.map(v => v / s) }));
        const Ai = A.map((M, h) => ({ m: M, prob: 1, micro: (i, j) => { const e = Sm[h][i].map(v => Math.exp(v)); const s = e.reduce((a, b) => a + b); return `softmax 第 ${i} 列：exp(S)=[${e.slice(0, i + 1).map(f2).join(', ')}]，Σ=${f2(s)}，A[t${i}][${j}] = ${f2(e[j])}/${f2(s)} = <b>${f2(M[i][j])}</b>` } }));
        P(l, 'Causal mask + Softmax', String.raw`A_{ij}=\frac{e^{S_{ij}}}{\sum_{k\le i}e^{S_{ik}}}\ (j\le i),\qquad A_{ij}=0\ (j>i)`, '因果遮罩：position i 只能看 j≤i，被遮的位置設為 −∞，softmax 後為 0。每一列加總為 1，A[i][j] 就是 position i 從 position j 讀多少。', [{ label: 'S（mask 後）', by: 'q', items: Sm.map(m => ({ m })) }, { label: 'A = softmax(S)', by: 'q', items: Ai }]);
        const O = A.map((a, h) => item(a, tr(V[Math.floor(h / grp)].m), 'A', 'V'));
        P(l, '加權和 A·V', String.raw`O_h=A_h\,V_g`, '每個 position 把「可見位置的 V」按注意力權重混合起來，這就是 attention 唯一跨 position 搬運資訊的步驟。', [{ label: 'A', by: 'q', items: Ai }, { label: 'V（對應的 KV group）', by: 'kv', items: V }, { label: 'O = A·V', by: 'q', items: O }]);
        const C = R(T).map(t => O.flatMap(o => o.m[t])), ao = item(C, tr(w.Wo), 'C', 'Wo');
        P(l, 'o_proj', String.raw`\mathrm{attn}=\big[O_1\,\|\,\cdots\,\|\,O_{H_q}\big]\,W_O`, '把所有 head 的輸出接起來，再用 W_O 投影回 d_model 維。等價於「每個 head 各自經過 W_O 的一個切片，再相加寫入 residual stream」。', [{ label: `C = concat(heads)（T×${Hq * hd}）`, items: [{ m: C }] }, { label: 'attn_out = C·W_O', items: [ao] }]);
        const x2 = add(x, ao.m); ck.push({ x: x2, label: `L${l} attn` });
        P(l, 'Residual 加回（attn）', String.raw`x\leftarrow x+\mathrm{Attn}(\mathrm{RMSNorm}(x))`, 'attention 的輸出以「加法」寫回 residual stream。下表是每個 position 的寫入量 ‖Δ‖ 與寫入方向和原向量的夾角。', [{ label: 'x（前）', items: [{ m: x }] }, { label: 'Δ = attn_out', items: [ao] }, { label: 'x + Δ', items: [{ m: x2 }] }], stats(x, ao.m));
        x = x2; const n2 = rms(x, w.g2);
        P(l, 'MLP RMSNorm', RMS, 'MLP 前的第二個 pre-norm。', [{ label: 'x', items: [{ m: x }] }, { label: 'x̂ = RMSNorm(x)', items: [{ m: n2 }] }]);
        const G = item(n2, tr(w.Wg), 'x̂', 'Wg'), U = item(n2, tr(w.Wu), 'x̂', 'Wu');
        P(l, 'gate / up 投影', String.raw`G=\hat X W_{gate},\qquad U=\hat X W_{up}`, `兩條平行的線性投影，維度從 ${d} 擴到 ${d * cfg.ffm}。MLP 對每個 position 獨立作用，不跨 token。`, [{ label: 'G = gate', items: [G] }, { label: 'U = up', items: [U] }]);
        const Sg = G.m.map(r => r.map(silu)), Hh = Sg.map((r, i) => r.map((v, j) => v * U.m[i][j]));
        P(l, 'SwiGLU', String.raw`H=\mathrm{silu}(G)\odot U,\qquad \mathrm{silu}(z)=z\,\sigma(z)=\frac{z}{1+e^{-z}}`, 'silu(G) 當作「閘門」，逐元素去調制 U：閘門接近 0 的神經元被關掉，正值較大的被放行。', [{ label: 'silu(G)', items: [{ m: Sg }] }, { label: 'U', items: [U] }, { label: 'H = silu(G) ⊙ U', items: [{ m: Hh }] }]);
        const Dn = item(Hh, tr(w.Wd), 'h', 'Wd');
        P(l, 'down_proj', String.raw`\mathrm{mlp}=H\,W_{down}`, '投影回 d_model。從 mech interp 角度，可視為「ff 個神經元各自帶著 W_down 的一列，按啟動量加權寫入 residual stream」。', [{ label: 'mlp_out = H·W_down', items: [Dn] }]);
        const x3 = add(x, Dn.m); ck.push({ x: x3, label: `L${l} mlp` });
        P(l, 'Residual 加回（MLP）', String.raw`x\leftarrow x+\mathrm{MLP}(\mathrm{RMSNorm}(x))`, 'MLP 的輸出加回 residual stream，完成一個 block。', [{ label: 'x（前）', items: [{ m: x }] }, { label: 'Δ = mlp_out', items: [Dn] }, { label: 'x + Δ', items: [{ m: x3 }] }], stats(x, Dn.m));
        x = x3;
      }
      const nf = rms(x, W.gf); ck.push({ x: nf, label: 'final' });
      P(L, 'Final RMSNorm', RMS, '最後一層之後的 norm。真實模型在這之後接 unembed 變成 logits，此處省略，輸出就是這個矩陣。', [{ label: 'x', items: [{ m: x }] }, { label: 'output', items: [{ m: nf }] }]);
    }

    /* ===== 渲染 ===== */
    const curItem = tn => tn.items[tn.by == 'q' ? sel.h : tn.by == 'kv' ? Math.floor(sel.h / (cfg.Hq / cfg.Hkv)) : 0];
    function matHTML(it, ti) {
      const m = it.m, fin = m.flat().filter(isFinite), mx = Math.max(1e-9, ...fin.map(Math.abs));
      let h = '<div class="mw"><table class="mt"><tr><th></th>' + m[0].map((_, j) => `<th>${j}</th>`).join('') + '</tr>';
      m.forEach((r, i) => {
        h += `<tr><th>t${i}</th>`; r.forEach((v, j) => {
          const a = isFinite(v) ? (it.prob ? v : Math.min(1, Math.abs(v) / mx)) * .8 : 0, c = it.prob || v >= 0 ? 'var(--pos)' : 'var(--neg)', bg = `background:rgba(${c},${a})`;
          const on = sel.mi && sel.mi[0] == ti && sel.mi[1] == i && sel.mi[2] == j;
          h += it.edit ? `<td><input data-i="${i}" data-j="${j}" value="${v.toFixed(2)}" style="${bg}"></td>` : `<td class="${it.micro ? 'cl' : ''}${on ? ' on' : ''}" data-t="${ti}" data-i="${i}" data-j="${j}" style="${bg}">${f2(v)}</td>`
        }); h += '</tr>'
      });
      return h + '</table></div>'
    }
    function chart() {
      const w = 290, h = 130, n = ck.length, mx = Math.max(...ck.flatMap(c => c.x.map(nrm))) * 1.1, X = i => 25 + i * (w - 35) / (n - 1), Y = v => h - 18 - v / mx * (h - 30);
      let s = `<svg viewBox="0 0 ${w} ${h}" width="100%">`; const ci = steps[sel.step].ci;
      s += `<rect x="${X(ci) - 3}" y="6" width="6" height="${h - 24}" fill="rgba(var(--pos),.25)"/>`;
      for (let t = 0; t < cfg.T; t++)s += `<polyline fill="none" stroke="hsl(${t * 360 / cfg.T},65%,52%)" stroke-width="1.6" points="${ck.map((c, i) => X(i) + ',' + Y(nrm(c.x[t]))).join(' ')}"/>`;
      s += ck.map((c, i) => `<text x="${X(i)}" y="${h - 4}" font-size="8" text-anchor="middle" fill="var(--mu)">${c.label.replace(/^L(\d) (.)/, '$1$2')}</text>`).join('') + `<text x="2" y="12" font-size="9" fill="var(--mu)">${f2(mx)}</text></svg>`;
      return s
    }
    function render() {
      const st = steps[sel.step], g = Math.floor(sel.h / (cfg.Hq / cfg.Hkv));
      $('#pos').textContent = `步驟 ${sel.step + 1} / ${steps.length}`;
      let li = '', last = -2; steps.forEach((s, i) => { if (s.layer != last) { last = s.layer; li += `<div class="lh">${s.layer < 0 ? 'Input' : s.layer == cfg.L ? 'Output' : 'Layer ' + s.layer}</div>` } li += `<div class="si${i == sel.step ? ' a' : ''}" data-s="${i}">${s.name}</div>` });
      $('#list').innerHTML = li; const a = $('#list .a'); a && a.scrollIntoView({ block: 'nearest' });
      let m = `<h2>${st.layer >= 0 && st.layer < cfg.L ? 'Layer ' + st.layer + ' · ' : ''}${st.name}</h2><div class="card"><div id="fx">\\[${st.tex}\\]</div></div><div class="mu">${st.desc}</div>`;
      if (st.st) m += `<div class="card st">${st.st}</div>`;
      st.tensors.forEach((tn, ti) => {
        const it = curItem(tn), lb = tn.by == 'q' ? ` — head ${sel.h}` : tn.by == 'kv' ? ` — KV group ${g}` : '';
        m += `<div class="tl">${tn.label}${lb}</div>${matHTML(it, ti)}`;
        if (sel.mi && sel.mi[0] == ti && it.micro) m += `<div class="mic">${it.micro(sel.mi[1], sel.mi[2])}</div>`
      });
      if (st.tensors.some(t => curItem(t).micro)) m += '<div class="mu" style="margin-top:6px">提示：點擊有底線游標的格子，可展開該格的逐項計算。</div>';
      $('#main').innerHTML = m;
      const c = cfg, op = (a, v) => a.map(x => `<option${x == v ? ' selected' : ''}>${x}</option>`).join('');
      const mInfo = (window.TOY_MODELS && window.TOY_MODELS[sel.model]) || { name: '自訂模型', desc: '' };
      $('#side').innerHTML = `
        <h3>${mInfo.name}</h3>
        <div class="mu" style="margin-bottom:8px">${mInfo.desc || ''}</div>
        <div class="row"><span class="mu">維度數 (d_model)</span><span>${c.d}</span></div>
        <div class="row"><span class="mu">層數 (L)</span><span>${c.L}</span></div>
        <div class="row"><span class="mu">Q heads (Hq)</span><span style="display:inline-flex;align-items:center;gap:4px">${c.Hq} <span class="mu"> / 當前</span><select id="hs" style="padding:1px 5px">${[...Array(c.Hq).keys()].map(i => `<option value="${i}"${i == sel.h ? ' selected' : ''}>${i}</option>`).join('')}</select></span></div>
        <div class="row"><span class="mu">KV heads (Hkv)</span><span>${c.Hkv} (GQA ${c.Hq / c.Hkv}:1)</span></div>
        <div class="row"><span class="mu">head_dim (hd)</span><span>${c.hd}</span></div>
        <div class="row"><span class="mu">MLP 倍率 (ffm)</span><span>${c.ffm} (ff=${c.d * c.ffm})</span></div>
        <div class="row"><span class="mu">RoPE θ</span><span>${c.theta}</span></div>
        <h3 class="tip-title">輸入設定 (Input / Prompt) <span class="info-icon">ⓘ</span>
          <span class="tip-box">調整 seq_len 或 seed 會重設 X₀，不影響當前模型權重。</span>
        </h3>
        <div class="row">seq_len (T)<select data-k="T">${op([3, 4, 5, 6, 7, 8], c.T)}</select></div>
        <div class="row">seed<input data-k="seed" type="number" value="${c.seed}" style="width:90px"></div>
        <h3 class="tip-title">殘差流範數 ‖xₜ‖ <span class="info-icon">ⓘ</span>
          <span class="tip-box">每條線是一個 position；橫軸是各 block 寫入後的檢查點，淺色帶是目前步驟。</span>
        </h3>
		  ${chart()}
        <h3>社群</h3>
		  <div class="mu">
        <a href="https://github.com/JunliXiao/toy-llama-stepper" target="_blank" rel="noopener" title="GitHub Repository" class="social-icon-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor" style="vertical-align: middle;">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8C0 11.54 2.29 14.53 5.47 15.59C5.87 15.66 6.02 15.42 6.02 15.21C6.02 15.02 6.01 14.39 6.01 13.72C4 14.09 3.48 13.23 3.32 12.78C3.23 12.55 2.84 11.84 2.5 11.65C2.22 11.5 1.82 11.13 2.49 11.12C3.12 11.11 3.57 11.7 3.72 11.94C4.44 13.15 5.59 12.81 6.05 12.6C6.12 12.08 6.33 11.73 6.56 11.53C4.78 11.33 2.92 10.64 2.92 7.58C2.92 6.71 3.23 5.99 3.74 5.43C3.66 5.23 3.38 4.41 3.82 3.31C3.82 3.31 4.49 3.1 6.02 4.13C6.66 3.95 7.34 3.86 8.02 3.86C8.7 3.86 9.38 3.95 10.02 4.13C11.55 3.09 12.22 3.31 12.22 3.31C12.66 4.41 12.38 5.23 12.3 5.43C12.81 5.99 13.12 6.7 13.12 7.58C13.12 10.65 11.25 11.33 9.47 11.53C9.76 11.78 10.01 12.26 10.01 13.01C10.01 14.08 10 14.94 10 15.21C10 15.42 10.15 15.67 10.55 15.59C13.71 14.53 16 11.53 16 8C16 3.58 12.42 0 8 0Z" />
          </svg>
        </a>
        <a href="https://www.threads.com/@xiao.junli" target="_blank" rel="noopener" title="Threads" class="social-icon-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 192 192" fill="currentColor" style="vertical-align: middle;">
            <path d="M141.537 88.9883C140.71 88.5919 139.87 88.2104 139.019 87.8451C137.537 60.5382 122.616 44.905 97.5619 44.745C97.4484 44.7443 97.3355 44.7443 97.222 44.7443C82.2364 44.7443 69.7731 51.1409 62.102 62.7807L75.881 72.2328C81.6116 63.5383 90.6052 61.6848 97.2286 61.6848C97.3051 61.6848 97.3819 61.6848 97.4576 61.6855C105.707 61.7381 111.932 64.1366 115.961 68.814C118.893 72.2193 120.854 76.925 121.825 82.8638C114.511 81.6207 106.601 81.2385 98.145 81.7233C74.3247 83.0954 59.0111 96.9879 60.0396 116.292C60.5615 126.084 65.4397 134.508 73.775 140.011C80.8224 144.663 89.899 146.938 99.3323 146.423C111.79 145.74 121.563 140.987 128.381 132.296C133.559 125.696 136.834 117.143 138.28 106.366C144.217 109.949 148.617 114.664 151.047 120.332C155.179 129.967 155.42 145.8 142.501 158.708C131.182 170.016 117.576 174.908 97.0135 175.059C74.2042 174.89 56.9538 167.575 45.7381 153.317C35.2355 139.966 29.8077 120.682 29.6052 96C29.8077 71.3178 35.2355 52.0336 45.7381 38.6827C56.9538 24.4249 74.2039 17.11 97.0132 16.9405C119.988 17.1113 137.539 24.4614 149.184 38.788C154.894 45.8136 159.199 54.6488 162.037 64.9503L178.184 60.6422C174.744 47.9622 169.331 37.0357 161.965 27.974C147.036 9.60668 125.202 0.195148 97.0695 0H96.9569C68.8816 0.19447 47.2921 9.6418 32.7883 28.0793C19.8819 44.4864 13.2244 67.3157 13.0007 95.9325L13 96L13.0007 96.0675C13.2244 124.684 19.8819 147.514 32.7883 163.921C47.2921 182.358 68.8816 191.806 96.9569 192H97.0695C122.03 191.827 139.624 185.292 154.118 170.811C173.081 151.866 172.51 128.119 166.26 113.541C161.776 103.087 153.227 94.5962 141.537 88.9883ZM98.4405 129.507C88.0005 130.095 77.1544 125.409 76.6196 115.372C76.2232 107.93 81.9158 99.626 99.0812 98.6368C101.047 98.5234 102.976 98.468 104.871 98.468C111.106 98.468 116.939 99.0737 122.242 100.233C120.264 124.935 108.662 128.946 98.4405 129.507Z" />
          </svg>
        </a>
      </div>`;
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([$('#fx')]).catch(() => { });
    }
    function recompute(regenX) { if (regenX) initInput(true); forward(); sel.mi = null; render() }
    function go(i) { sel.step = Math.max(0, Math.min(steps.length - 1, i)); sel.mi = null; render() }
    $('#b0').onclick = () => go(0); $('#b1').onclick = () => go(steps.length - 1); $('#bp').onclick = () => go(sel.step - 1); $('#bn').onclick = () => go(sel.step + 1);
    $('#th').onclick = () => {
      const r = document.documentElement;
      // 預設為淺色 (light)，切換為深色 (dark)；若已是深色則切回淺色
      const isDark = r.dataset.theme !== 'dark';
      r.dataset.theme = isDark ? 'dark' : 'light';

      // 切換 Favicon 檔案路徑
      const iconEl = $('#favicon');
      if (iconEl) {
        iconEl.href = isDark ? './resources/icon-dark.svg' : './resources/icon-light.svg';
      }
    };

    /* ===== Modal 快捷鍵指南控制 ===== */
    const toggleModal = open => {
      const el = $('#modal-kb');
      if (!el) return;
      if (open === undefined) el.classList.toggle('open');
      else if (open) el.classList.add('open');
      else el.classList.remove('open');
    };
    $('#hk').onclick = () => toggleModal(true);
    $('#modal-close').onclick = () => toggleModal(false);
    $('#modal-kb').onclick = e => { if (e.target === $('#modal-kb')) toggleModal(false); };

    /* ===== 側邊欄收合控制 ===== */
    const toggleL = () => {
      const isHidden = $('#app').classList.toggle('hide-l');
      $('#tl').classList.toggle('toggled', isHidden);
      $('#tl').title = isHidden ? '展開左側步驟清單 (快捷鍵: [)' : '收合左側步驟清單 (快捷鍵: [)';
    };
    const toggleR = () => {
      const isHidden = $('#app').classList.toggle('hide-r');
      $('#tr').classList.toggle('toggled', isHidden);
      $('#tr').title = isHidden ? '展開右側資訊欄 (快捷鍵: ])' : '收合右側資訊欄 (快捷鍵: ])';
    };
    $('#tl').onclick = toggleL;
    $('#tr').onclick = toggleR;

    /* ===== 全域鍵盤快捷鍵監聽 ===== */
    document.addEventListener('keydown', e => {
      if (/INPUT|SELECT/.test(e.target.tagName)) return;

      // ? 鍵（或 Shift + /）：開關快捷鍵指南
      if (e.key === '?' || (e.key === '/' && e.shiftKey)) {
        e.preventDefault();
        toggleModal();
        return;
      }

      // Esc 鍵：若指南開啟則關閉
      if (e.key === 'Escape') {
        const el = $('#modal-kb');
        if (el && el.classList.contains('open')) {
          e.preventDefault();
          toggleModal(false);
          return;
        }
      }

      // 若 Modal 處於開啟狀態，暫停其他操作以避免干擾
      const modalOpen = $('#modal-kb') && $('#modal-kb').classList.contains('open');
      if (modalOpen) return;

      // [ 鍵：切換左側欄收合
      if (e.key === '[') {
        e.preventDefault();
        toggleL();
        return;
      }

      // ] 鍵：切換右側欄收合
      if (e.key === ']') {
        e.preventDefault();
        toggleR();
        return;
      }

      // Q 鍵：Q head 循環 -1
      if (e.key === 'q' || e.key === 'Q') {
        e.preventDefault();
        sel.h = (sel.h - 1 + cfg.Hq) % cfg.Hq;
        sel.mi = null;
        render();
        return;
      }

      // W 鍵：Q head 循環 +1
      if (e.key === 'w' || e.key === 'W') {
        e.preventDefault();
        sel.h = (sel.h + 1) % cfg.Hq;
        sel.mi = null;
        render();
        return;
      }

      // 左右方向鍵：上一步 / 下一步（支援 Ctrl / Cmd 極值跳轉）
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) go(steps.length - 1);
        else go(sel.step + 1);
        return;
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) go(0);
        else go(sel.step - 1);
        return;
      }

      // 上下方向鍵：跨 Layer 切換同算子階段（Layer 0 頂部與 Layer 3 底部不動作）
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const cur = steps[sel.step];
        if (!cur || cur.layer < 0 || cur.layer >= cfg.L) return;

        const targetLayer = e.key === 'ArrowUp' ? cur.layer - 1 : cur.layer + 1;
        if (targetLayer < 0 || targetLayer >= cfg.L) return;

        const targetIdx = steps.findIndex(s => s.layer === targetLayer && s.name === cur.name);
        if (targetIdx !== -1) go(targetIdx);
        return;
      }
    });
    $('#list').onclick = e => { const s = e.target.closest('.si'); s && go(+s.dataset.s) };
    $('#main').onclick = e => { const td = e.target.closest('td.cl'); if (td) { sel.mi = [+td.dataset.t, +td.dataset.i, +td.dataset.j]; render() } };
    $('#main').onchange = e => { const t = e.target; if (t.dataset.i != null) { X0[+t.dataset.i][+t.dataset.j] = parseFloat(t.value) || 0; recompute(false) } };
    $('#ms').onchange = e => { loadModel(e.target.value, false); };
    $('#side').onchange = e => {
      const t = e.target;
      if (t.id === 'hs') {
        sel.h = +t.value;
        sel.mi = null;
        render();
        return;
      }
      const k = t.dataset.k; if (!k) return;
      cfg[k] = +t.value;
      initInput(true);
      forward();
      sel.mi = null;
      render();
    };
    function fillHs() { if ($('#hs')) $('#hs').innerHTML = [...Array(cfg.Hq).keys()].map(i => `<option value="${i}"${i == sel.h ? ' selected' : ''}>${i}</option>`).join('') }
    function fillMs() {
      const models = window.TOY_MODELS || {};
      const keys = Object.keys(models);
      if (keys.length) {
        $('#ms').innerHTML = keys.map(k => `<option value="${k}"${k == sel.model ? ' selected' : ''}>${models[k].name}</option>`).join('');
      }
    }
    loadModel('baseline', true);
  </script>
